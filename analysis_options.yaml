# Static analysis, run by `flutter analyze` and the automated checks.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
  language:
    # No implicit dynamic casts, inference or raw generic types.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # A future must be awaited, or explicitly left running with unawaited().
    - discarded_futures
    - unawaited_futures
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
