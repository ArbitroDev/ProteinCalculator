name: Store listing

# Updates the main Google Play listing, French and English, from the store
# folder: titles, descriptions, icon, feature graphic and the screenshots of
# the phone and of the watch, which replace those shown. Run by hand, once
# the store folder is up to date on the branch it runs on; a release to
# production sends it too.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the listing with Google Play without publishing it
        type: boolean
        default: false

concurrency:
  group: store-listing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  listing:
    name: Update the listing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/store-listing
        with:
          service-account: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          dry-run: ${{ inputs.dry_run }}
