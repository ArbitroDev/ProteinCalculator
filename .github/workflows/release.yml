name: Release

# Publishing flow: every merge into main builds the signed app bundle,
# sends it to the closed testing track of Google Play and tags the version.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  release:
    name: Build and publish
    # Nothing is published unless formatting, analysis and tests pass on
    # this very commit.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//')
          name=${version%%+*}
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$name" >/dev/null 2>&1; then
            echo "::error::Tag v$name already exists: increase the version in pubspec.yaml."
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Set up signing and crash reporting
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          jq -n --arg dsn "$SENTRY_DSN" '{SENTRY_DSN: $dsn}' > sentry.json

      - name: Build the app bundle
        run: flutter build appbundle --release --dart-define-from-file=sentry.json

      - name: Upload to Google Play (closed testing)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: arbitro.android.protein_calculator
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          # whatsnew-fr-FR and whatsnew-en-US, written before the release.
          whatsNewDirectory: store/whatsnew
          # Lets Google Play read the stack traces of the Android code,
          # shrunk by R8 in release builds.
          mappingFile: build/app/outputs/mapping/release/mapping.txt

      - name: Tag the version with its changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash .github/scripts/release_notes.sh "${TAG#v}" > release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release-notes.md

      - name: Remove the signing files
        if: always()
        run: rm -f android/app/upload.jks android/key.properties sentry.json
