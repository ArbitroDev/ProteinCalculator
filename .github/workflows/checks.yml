name: Checks

on:
  pull_request:
  push:
    branches: [develop]
  # The release workflow runs them before publishing from main.
  workflow_call:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  watch:
    name: Watch app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Writes the Gradle wrapper and local.properties, without building.
      - name: Set up the Gradle build
        run: flutter build apk --config-only

      # The watch app, the messages it exchanges with the phone, and the
      # plugin of the phone app linking them. The release build checks that
      # the shrunk app still works with its libraries.
      - name: Lint, test and build the watch app
        working-directory: android
        run: >-
          ./gradlew --no-daemon
          :wear:protocol:test
          :wear:lintRelease
          :wear:testReleaseUnitTest
          :wear:assembleRelease
          :watch_link:lintRelease
