name: protein_calculator
description: "Daily protein intake tracker."
publish_to: 'none'

version: 0.7.0+8

environment:
  sdk: ^3.13.0

dependencies:
  characters: ^1.4.1
  collection: ^1.19.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.21
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  sentry_flutter: 9.30.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - LICENSE.md
    - assets/fonts/OFL-Outfit.txt
    - assets/fonts/OFL-SairaSemiCondensed.txt
    - assets/licenses/LICENSE-Octicons.txt

  fonts:
    - family: Saira Semi Condensed
      fonts:
        - asset: assets/fonts/SairaSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SairaSemiCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/SairaSemiCondensed-ExtraBold.ttf
          weight: 800
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
