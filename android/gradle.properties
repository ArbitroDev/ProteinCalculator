org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Release builds of the phone and watch apps: R8 removes the unused resources
# together with the code, as asked by Google Play. The default from the
# Android Gradle plugin 9, where this line can go. Resources only looked up by
# name must be listed in android/app/src/main/res/raw/keep.xml.
android.r8.optimizedResourceShrinking=true
# The watch app has its own version code on Google Play: the one of the
# phone app plus this offset, so the two never collide. Also read by
# .github/scripts/check_version.sh.
wear.versionCodeOffset=1000000
