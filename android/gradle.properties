org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Unit tests for every build type, as before the Android Gradle plugin 9:
# the automated checks test the watch app in release (testReleaseUnitTest).
android.onlyEnableUnitTestForTheTestedBuildType=false
# The watch app has its own version code on Google Play: the one of the
# phone app plus this offset, so the two never collide. Also read by
# .github/scripts/check_version.sh.
wear.versionCodeOffset=1000000
