# Libraries of the watch app and of its link with the phone app. The Gradle
# plugins follow the versions set by Flutter, in settings.gradle.kts.
#
# The newest AndroidX versions need the Android Gradle plugin 9, which
# Flutter does not use yet.
[versions]
activity = "1.13.0"
complications = "1.3.0"
compose-bom = "2026.09.00"
coroutines = "1.11.0"
datastore = "1.2.1"
lifecycle = "2.10.0"
play-services-wearable = "20.0.1"
protolayout = "1.4.2"
serialization = "1.11.0"
tiles = "1.6.2"
wear-compose = "1.6.2"
wear-input = "1.2.0"
work = "2.12.0"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
complications-data-source = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "complications" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "play-services-wearable" }
protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "protolayout" }
protolayout-expression = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "protolayout" }
protolayout-material3 = { module = "androidx.wear.protolayout:protolayout-material3", version.ref = "protolayout" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
tiles = { module = "androidx.wear.tiles:tiles", version.ref = "tiles" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wear-compose" }
wear-input = { module = "androidx.wear:wear-input", version.ref = "wear-input" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
